<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FFB546">
<title>豆豆背单词 🦊</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<style>
:root{
  /* warm playful palette */
  --bg-1:#FFF4E6; --bg-2:#FFE8C9; --bg-3:#FFDDE1;
  --ink:#3D2B1F;       /* dark brown text */
  --ink-soft:#7A5C48;
  --ink-light:#B89B85;
  --paper:#FFFFFF;
  --paper-warm:#FFFBF3;
  --line:#F1E0CC;

  --p1:#FF6B6B;        /* coral primary */
  --p1-deep:#E84F4F;
  --p2:#FFB546;        /* orange */
  --p2-deep:#F09020;
  --p3:#4ECDC4;        /* mint */
  --p3-deep:#2BB8AE;
  --p4:#A78BFA;        /* lilac */
  --yellow:#FFD93D;
  --pink:#FFA8C5;

  --good:#51CF66;
  --good-deep:#37B24D;
  --bad:#FF6B6B;

  --r-lg:24px; --r-md:18px; --r-sm:12px;
  --shadow-card:0 6px 0 rgba(61,43,31,.08), 0 4px 24px rgba(255,107,107,.10);
  --shadow-pop:0 8px 0 rgba(61,43,31,.12), 0 12px 32px rgba(255,107,107,.18);
  --shadow-btn:0 5px 0 var(--btn-shadow,#C44545);

  --font:'Fredoka','ZCOOL KuaiLe','PingFang SC','Hiragino Sans GB','Microsoft Yahei',sans-serif;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{
  font-family:var(--font);font-weight:500;color:var(--ink);
  background:
    radial-gradient(circle at 12% 8%, #FFE0BC 0%, transparent 35%),
    radial-gradient(circle at 88% 18%, #FFD0DC 0%, transparent 38%),
    radial-gradient(circle at 50% 95%, #BFEBE7 0%, transparent 45%),
    linear-gradient(160deg, var(--bg-1) 0%, var(--bg-2) 60%, var(--bg-3) 100%);
  background-attachment:fixed;
  min-height:100vh;min-height:100dvh;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
/* sprinkle background dots */
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    radial-gradient(circle, rgba(255,181,70,.35) 1.5px, transparent 2px),
    radial-gradient(circle, rgba(255,107,107,.25) 1.5px, transparent 2px);
  background-size:48px 48px, 73px 73px;
  background-position:0 0, 24px 36px;
  opacity:.55;
}

#app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative;z-index:1}
.page{display:none;min-height:100vh;min-height:100dvh;padding-bottom:32px;opacity:1}
.page.active{display:block;opacity:1!important}

#page-word.active,#page-learn.active{
  display:flex!important;flex-direction:column;
  height:100vh;height:100dvh;min-height:0;padding-bottom:0;overflow:hidden;
}
#page-word>.app-bar,#page-learn>.app-bar{position:relative;flex-shrink:0}
#page-word .word-scroll,#page-learn .learn-container{flex:1 1 0%;overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:0}
#page-learn .learn-bottom-nav{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px;padding-bottom:max(14px,env(safe-area-inset-bottom));
  gap:10px;background:var(--paper);border-top:3px solid var(--line);flex-shrink:0;
}

/* ========== App Bar ========== */
.app-bar{
  position:sticky;top:0;z-index:100;
  padding:14px 18px;padding-top:max(14px,env(safe-area-inset-top));
  display:flex;align-items:center;gap:10px;
  background:linear-gradient(180deg, rgba(255,244,230,.95), rgba(255,244,230,.6));
  backdrop-filter:blur(8px);
}
.app-bar h1{font-size:20px;font-weight:700;flex:1;text-align:center;color:var(--ink);letter-spacing:.5px}
.icon-btn{
  width:42px;height:42px;border:none;cursor:pointer;flex-shrink:0;
  background:var(--paper);border-radius:50%;
  font-size:20px;color:var(--ink);font-weight:700;font-family:var(--font);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 3px 0 rgba(61,43,31,.12);
  transition:transform .12s, box-shadow .12s;
}
.icon-btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(61,43,31,.12)}
.icon-btn.invisible{visibility:hidden;pointer-events:none}
.dropdown-wrap{position:relative;display:inline-block}
.dropdown-menu{
  display:none;position:absolute;right:0;top:calc(100% + 6px);
  background:var(--paper);border-radius:14px;min-width:160px;
  box-shadow:0 8px 28px rgba(61,43,31,.18),0 1px 4px rgba(61,43,31,.08);
  border:2px solid var(--line);z-index:100;overflow:hidden;
  animation:dropIn .15s ease-out;
}
.dropdown-menu.show{display:block}
@keyframes dropIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.dropdown-item{
  display:flex;align-items:center;gap:10px;padding:13px 18px;
  font-size:15px;color:var(--ink);cursor:pointer;border:none;
  background:none;width:100%;text-align:left;font-family:inherit;
  transition:background .12s;
}
.dropdown-item:not(:last-child){border-bottom:1px solid var(--line)}
.dropdown-item:active,.dropdown-item:hover{background:var(--bg)}

/* coin/streak chip in header */
.chip-row{display:flex;gap:8px;padding:6px 16px 4px;justify-content:flex-end}
.chip{
  display:inline-flex;align-items:center;gap:5px;
  background:var(--paper);border-radius:20px;
  padding:6px 12px;font-size:13px;font-weight:600;
  box-shadow:0 2px 0 rgba(61,43,31,.08);
  border:2px solid var(--line);
}
.chip .ic{font-size:15px;line-height:1}
.chip.coin{background:linear-gradient(180deg,#FFF8DC,#FFE99A);border-color:#F5C842;color:#7A5400}
.chip.streak{background:linear-gradient(180deg,#FFE0E0,#FFB8B8);border-color:#FF8585;color:#A23030}

/* ========== Home ========== */
.home-greet{text-align:center;padding:8px 16px 4px;position:relative}
.home-greet h2{font-size:24px;font-weight:700;color:var(--ink);margin-top:6px}
.home-greet p{color:var(--ink-soft);margin-top:4px;font-size:14px;font-weight:500}

/* mascot speech bubble */
.mascot-stage{
  position:relative;display:flex;justify-content:center;align-items:flex-end;
  margin:8px auto 0;height:170px;
}
.mascot-svg{width:170px;height:170px;filter:drop-shadow(0 8px 0 rgba(61,43,31,.10))}
.mascot-svg .body-group{transform-origin:50% 70%;animation:mascotIdle 3.2s ease-in-out infinite}
.mascot-svg .blink{animation:blink 4.2s infinite}
@keyframes mascotIdle{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-4px) rotate(1.5deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}94%,98%{transform:scaleY(.05)}}
.bubble{
  position:absolute;left:50%;top:6px;transform:translateX(-50%);
  background:#fff;border:3px solid var(--ink);border-radius:18px;
  padding:8px 14px;font-size:13px;font-weight:600;color:var(--ink);
  white-space:nowrap;box-shadow:3px 3px 0 rgba(61,43,31,.18);
  animation:bubblePop .5s cubic-bezier(.4,1.7,.5,1);
}
.bubble::after{
  content:'';position:absolute;left:50%;bottom:-10px;transform:translateX(-50%);
  width:0;height:0;border:8px solid transparent;border-top-color:#fff;border-bottom:0;
  filter:drop-shadow(0 2px 0 var(--ink));
}
@keyframes bubblePop{0%{opacity:0;transform:translateX(-50%) scale(.4) translateY(8px)}100%{opacity:1;transform:translateX(-50%) scale(1) translateY(0)}}

/* main CTA on home */
.home-cta-wrap{padding:14px 16px 8px}
.home-cta{
  width:100%;display:flex;align-items:center;justify-content:space-between;
  background:linear-gradient(180deg,#FF8E5E 0%,#FF6B4B 100%);
  color:#fff;border:none;cursor:pointer;
  border-radius:var(--r-lg);padding:18px 22px;
  font-family:var(--font);font-size:18px;font-weight:700;
  box-shadow:0 6px 0 #C04428, 0 12px 24px rgba(255,107,107,.35);
  transition:transform .12s, box-shadow .12s;
  position:relative;overflow:hidden;
}
.home-cta::before{
  content:'';position:absolute;top:-30%;right:-20%;width:140px;height:140px;
  background:radial-gradient(circle,rgba(255,255,255,.35),transparent 60%);
  pointer-events:none;
}
.home-cta:active{transform:translateY(4px);box-shadow:0 2px 0 #C04428, 0 6px 16px rgba(255,107,107,.3)}
.home-cta .cta-left{display:flex;flex-direction:column;text-align:left;gap:4px;z-index:1}
.home-cta .cta-tag{font-size:12px;font-weight:600;opacity:.9;letter-spacing:.5px}
.home-cta .cta-arrow{font-size:28px;font-weight:700;z-index:1}

.home-cta.disabled{background:linear-gradient(180deg,#D8C5B0,#B89B85);box-shadow:0 6px 0 #8E7158}
.home-cta.disabled:active{transform:translateY(4px);box-shadow:0 2px 0 #8E7158}

/* tile grid */
.tile-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:16px}
.tile{
  background:var(--paper);border-radius:var(--r-md);padding:14px 6px 10px;
  text-align:center;cursor:pointer;
  box-shadow:0 4px 0 rgba(61,43,31,.08);
  border:2.5px solid var(--line);
  transition:transform .12s, box-shadow .12s;
}
.tile:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(61,43,31,.08)}
.tile .ic-wrap{
  width:42px;height:42px;border-radius:14px;
  margin:0 auto 6px;display:flex;align-items:center;justify-content:center;font-size:22px;
}
.tile.t1 .ic-wrap{background:#FFE5C9;color:#D67215}
.tile.t2 .ic-wrap{background:#D7F4F1;color:#188D87}
.tile.t3 .ic-wrap{background:#F1E5FF;color:#6B47B8}
.tile.t4 .ic-wrap{background:#FFD8E0;color:#C4365A}
.tile-label{font-size:12px;font-weight:600;color:var(--ink)}
.tile-sub{font-size:10px;color:var(--ink-light);margin-top:2px;font-weight:500}

/* daily summary card */
.summary-card{
  margin:8px 16px 0;background:var(--paper);border-radius:var(--r-lg);
  padding:18px 20px;box-shadow:var(--shadow-card);
  border:2.5px solid var(--line);
  display:flex;align-items:center;gap:14px;
}
.summary-card .big{font-size:32px;line-height:1}
.summary-card .text{flex:1}
.summary-card .text b{display:block;font-size:15px;color:var(--ink);font-weight:700}
.summary-card .text span{font-size:13px;color:var(--ink-soft);font-weight:500}

.backup-reminder{
  margin:14px 16px 0;padding:14px 16px;
  background:linear-gradient(135deg,#FFF1C5,#FFE082);
  border-radius:var(--r-md);border:2.5px solid #F0C040;
  display:flex;align-items:center;gap:12px;cursor:pointer;
  box-shadow:0 4px 0 rgba(61,43,31,.08);
}
.backup-reminder .ic{font-size:24px;flex-shrink:0}
.backup-reminder .tx{flex:1;font-size:13px;color:#7A5400;line-height:1.45;font-weight:500}
.backup-reminder .tx strong{display:block;font-size:14px;color:#5D3F00;font-weight:700;margin-bottom:2px}
.backup-reminder .ac{
  flex-shrink:0;padding:7px 14px;background:#F09020;color:#fff;border:none;
  border-radius:50px;font-size:12px;font-weight:700;font-family:var(--font);
  box-shadow:0 3px 0 #C46818;cursor:pointer;
}

/* ========== Generic Buttons ========== */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:14px 22px;border:none;cursor:pointer;
  border-radius:var(--r-md);font-family:var(--font);font-size:16px;font-weight:700;
  transition:transform .12s, box-shadow .12s;user-select:none;
  --btn-shadow:#C44545;
  background:linear-gradient(180deg,#FF8E5E,#FF6B4B);color:#fff;
  box-shadow:0 5px 0 var(--btn-shadow);
}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 var(--btn-shadow)}
.btn-primary{--btn-shadow:#C04428;background:linear-gradient(180deg,#FF8E5E,#FF6B4B);color:#fff}
.btn-secondary{--btn-shadow:#D9C8B0;background:var(--paper);color:var(--ink);border:2.5px solid var(--line)}
.btn-success{--btn-shadow:#2A9D40;background:linear-gradient(180deg,#65E07C,#43C95E);color:#fff}
.btn-mint{--btn-shadow:#2BB8AE;background:linear-gradient(180deg,#6FE0D8,#4ECDC4);color:#fff}
.btn-block{display:flex;width:100%}
.btn-large{padding:18px 30px;font-size:18px;border-radius:20px}
.btn-small{padding:10px 16px;font-size:14px;border-radius:14px}

/* ========== Vocab Page ========== */
.vocab-toolbar{display:flex;gap:10px;padding:0 16px 14px;align-items:center}
.vocab-search{
  flex:1;height:46px;border:2.5px solid var(--line);border-radius:18px;
  padding:0 16px;font-size:15px;font-family:var(--font);font-weight:500;
  outline:none;background:var(--paper);color:var(--ink);
  transition:border-color .15s, box-shadow .15s;
}
.vocab-search::placeholder{color:var(--ink-light)}
.vocab-search:focus{border-color:var(--p1);box-shadow:0 0 0 3px rgba(255,107,107,.18)}
.vocab-import-btn{
  height:46px;padding:0 16px;border:none;cursor:pointer;
  border-radius:18px;font-family:var(--font);font-size:14px;font-weight:700;
  background:linear-gradient(180deg,#FFCB6B,#FFB546);color:#5C3A00;
  box-shadow:0 4px 0 #C97D14;
}
.vocab-import-btn:active{transform:translateY(2px);box-shadow:0 2px 0 #C97D14}
.vocab-list{padding:0 16px}
.vocab-item{
  display:flex;align-items:center;gap:12px;cursor:pointer;
  background:var(--paper);border-radius:var(--r-md);
  padding:14px 16px;margin-bottom:10px;
  box-shadow:0 3px 0 rgba(61,43,31,.06);
  border:2px solid var(--line);
  transition:transform .12s, box-shadow .12s;
}
.vocab-item:active{transform:translateY(1px);box-shadow:0 2px 0 rgba(61,43,31,.06)}
.vocab-mini{
  width:38px;height:38px;border-radius:12px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;
  color:#fff;
}
.vocab-item-main{flex:1;min-width:0}
.vocab-item-en{font-size:16px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vocab-item-cn{font-size:13px;color:var(--ink-soft);margin-top:2px;font-weight:500}
.vocab-item-stats{font-size:11px;color:var(--ink-light);white-space:nowrap;font-weight:600}
.vocab-item-stats .acc-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:middle}

.empty-box{text-align:center;padding:50px 20px;color:var(--ink-light)}
.empty-box .ic{font-size:48px;margin-bottom:10px}
.empty-box p{font-size:14px;font-weight:500}

/* ========== Word Detail ========== */
.word-card-full{
  background:var(--paper);border-radius:var(--r-lg);
  padding:26px 22px;margin:16px;text-align:center;
  box-shadow:var(--shadow-card);border:2.5px solid var(--line);
}
.word-en{font-size:36px;font-weight:700;color:var(--ink);word-break:break-word}
.word-phonetic{font-size:16px;color:var(--ink-soft);margin-top:6px;font-weight:500;font-family:'Fredoka',sans-serif}
.btn-speak{
  display:inline-flex;align-items:center;gap:6px;margin-top:12px;
  padding:8px 18px;border:2.5px solid var(--p3);cursor:pointer;
  border-radius:24px;background:#fff;color:var(--p3-deep);
  font-size:14px;font-weight:700;font-family:var(--font);
  box-shadow:0 3px 0 var(--p3-deep);
}
.btn-speak:active{transform:translateY(2px);box-shadow:0 1px 0 var(--p3-deep)}
.word-cn{
  font-size:24px;font-weight:700;color:var(--p1-deep);
  margin-top:18px;padding-top:16px;
  border-top:2.5px dashed var(--line);
}
.word-explanation{
  text-align:left;margin-top:16px;padding:14px 16px;
  background:var(--paper-warm);border:2px solid var(--line);
  border-radius:var(--r-sm);font-size:14px;line-height:1.7;color:var(--ink-soft);font-weight:500;
}
.word-explanation h1,.word-explanation h2,.word-explanation h3{color:var(--ink);margin:8px 0 4px;font-weight:700}
.word-explanation p{margin:6px 0}
.word-explanation ul,.word-explanation ol{padding-left:20px}
.word-explanation code{background:#FFE5C9;color:#7A4400;padding:2px 6px;border-radius:5px;font-size:13px}
.word-stats-bar{display:flex;justify-content:center;gap:16px;margin-top:16px;font-size:13px;color:var(--ink-light);font-weight:600;flex-wrap:wrap}
.word-stats-bar span{display:inline-flex;align-items:center;gap:4px}
.word-nav{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px;padding-bottom:max(14px,env(safe-area-inset-bottom));
  gap:10px;background:var(--paper);border-top:3px solid var(--line);flex-shrink:0;
}
.word-nav-info{font-size:14px;color:var(--ink-soft);font-weight:700}

/* ========== Plan Page ========== */
.plan-form{padding:8px 16px}
.form-group{
  background:var(--paper);border-radius:var(--r-lg);
  padding:18px 20px;margin-bottom:14px;
  box-shadow:0 4px 0 rgba(61,43,31,.06);border:2.5px solid var(--line);
}
.form-label{display:block;font-size:15px;font-weight:700;color:var(--ink);margin-bottom:4px}
.form-hint{font-size:12px;color:var(--ink-light);margin-bottom:10px;font-weight:500}
.form-input{
  width:100%;height:52px;border:2.5px solid var(--line);
  border-radius:14px;padding:0 16px;
  font-size:20px;font-weight:700;font-family:var(--font);
  color:var(--p1-deep);text-align:center;outline:none;
  background:var(--paper-warm);
  transition:border-color .15s, box-shadow .15s;
}
.form-input:focus{border-color:var(--p1);box-shadow:0 0 0 3px rgba(255,107,107,.18);background:#fff}

/* number stepper */
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{
  width:44px;height:44px;border-radius:14px;border:none;cursor:pointer;
  background:var(--paper-warm);color:var(--ink);font-size:24px;font-weight:700;font-family:var(--font);
  border:2.5px solid var(--line);
  box-shadow:0 3px 0 rgba(61,43,31,.08);
}
.stepper button:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(61,43,31,.08)}
.stepper .form-input{flex:1}

/* ========== Learn Page ========== */
.learn-container{padding:14px 16px 20px}

.learn-progress-bar{
  height:14px;background:#FFE5C9;border-radius:8px;
  margin:10px 0 6px;overflow:hidden;
  border:2px solid #E5C7A0;box-shadow:inset 0 2px 0 rgba(61,43,31,.08);
  position:relative;
}
.learn-progress-bar .fill{
  height:100%;border-radius:6px;
  background:linear-gradient(90deg,#FF8E5E 0%,#FFB546 50%,#FFD93D 100%);
  transition:width .45s cubic-bezier(.4,1.7,.5,1);
  box-shadow:0 0 8px rgba(255,181,70,.6);
  position:relative;
}
.learn-progress-bar .fill::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);
  background-size:50px 100%;animation:shimmer 1.6s linear infinite;
}
@keyframes shimmer{0%{background-position:-50px 0}100%{background-position:calc(100% + 50px) 0}}
.learn-progress-text{text-align:center;font-size:13px;color:var(--ink-soft);font-weight:600;margin-bottom:14px}
.round-pill{
  display:inline-block;background:var(--p4);color:#fff;padding:3px 10px;border-radius:50px;
  font-size:11px;font-weight:700;margin-left:6px;
}

/* mini mascot top */
.learn-top{display:flex;align-items:center;gap:10px;margin:6px 0 4px}
.mini-mascot{width:54px;height:54px;flex-shrink:0}
.learn-top .pgwrap{flex:1}

.preview-card,.test-question-card{
  background:var(--paper);border-radius:var(--r-lg);
  padding:24px 20px;text-align:center;
  box-shadow:var(--shadow-card);border:2.5px solid var(--line);
  animation:slideUp .35s cubic-bezier(.4,1.7,.5,1);
  position:relative;
}
.test-question-card{margin-bottom:18px;transition:transform .25s, box-shadow .25s}
.test-question-card.correct-flash{
  border-color:var(--good);box-shadow:0 0 0 4px rgba(81,207,102,.3), var(--shadow-card);
  animation:correctPulse .55s ease;
}
.test-question-card.wrong-flash{
  border-color:var(--bad);box-shadow:0 0 0 4px rgba(255,107,107,.3), var(--shadow-card);
  animation:shake .45s ease;
}

<script>
/* ==== UTILITIES ==== */
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function getToday(){return new Date().toISOString().split('T')[0]}
function formatDate(d){if(!d)return'';const x=new Date(d+'T00:00:00');return`${x.getMonth()+1}月${x.getDate()}日`}
function daysBetween(d1,d2){return Math.floor((new Date(d2+'T00:00:00')-new Date(d1+'T00:00:00'))/86400000)}
function addDays(d,n){const x=new Date(d+'T00:00:00');x.setDate(x.getDate()+n);return x.toISOString().split('T')[0]}
function escapeHtml(s){const d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML}
function getWordExample(w){
  if(w.exampleEn)return{en:w.exampleEn,cn:w.exampleCn||''};
  if(!w.explanation)return null;
  const m=w.explanation.match(/\*\*例句\*\*[:：]\s*(.+)/);
  return m?{en:m[1].trim(),cn:''}:null;
}

/* ==== STORAGE ==== */
const DB_NAME='rtsw_db',DB_VERSION=1,STORE_NAME='kv';
const KEYS={WORDS:'rtsw_words',PLAN:'rtsw_plan',SESSIONS:'rtsw_sessions',CURRENT:'rtsw_current',LAST_BACKUP:'rtsw_last_backup',COINS:'rtsw_coins',STREAK:'rtsw_streak'};

const Storage={
  _db:null,_cache:{},
  async openDB(){if(this._db)return this._db;return new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,DB_VERSION);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains(STORE_NAME))d.createObjectStore(STORE_NAME)};r.onsuccess=()=>{this._db=r.result;res(this._db)};r.onerror=()=>rej(r.error)})},
  async init(){
    const db=await this.openDB();
    const flag='__rtsw_migrated';
    if(!localStorage.getItem(flag)){
      for(const k of Object.values(KEYS)){const raw=localStorage.getItem(k);if(raw!==null){try{this._cache[k]=JSON.parse(raw)}catch{}}}
      if(Object.keys(this._cache).length){const tx=db.transaction(STORE_NAME,'readwrite');const s=tx.objectStore(STORE_NAME);for(const[k,v]of Object.entries(this._cache))s.put(v,k);await new Promise((r,j)=>{tx.oncomplete=r;tx.onerror=j})}
      localStorage.setItem(flag,'1');
    }
    const tx=db.transaction(STORE_NAME,'readonly');const s=tx.objectStore(STORE_NAME);
    const allKeys=await new Promise((r,j)=>{const x=s.getAllKeys();x.onsuccess=()=>r(x.result);x.onerror=j});
    for(const k of allKeys){this._cache[k]=await new Promise((r,j)=>{const x=s.get(k);x.onsuccess=()=>r(x.result);x.onerror=j})}
  },
  get(k,fb=null){return this._cache[k]!==undefined?this._cache[k]:fb},
  set(k,v){this._cache[k]=v;if(this._db){const tx=this._db.transaction(STORE_NAME,'readwrite');tx.objectStore(STORE_NAME).put(v,k)}},
  remove(k){delete this._cache[k];if(this._db){const tx=this._db.transaction(STORE_NAME,'readwrite');tx.objectStore(STORE_NAME).delete(k)}},
  async exportAll(){const d={};for(const k of Object.values(KEYS)){const v=this.get(k);if(v!==null)d[k]=v}return d},
  async importAll(d){for(const[k,v]of Object.entries(d)){if(Object.values(KEYS).includes(k))this.set(k,v)}}
};

/* ==== STORES ==== */
const WordStore={
  _cache:null,
  getAll(){if(!this._cache)this._cache=Storage.get(KEYS.WORDS,{});return this._cache},
  get(en){return this.getAll()[en]||null},
  count(){return Object.keys(this.getAll()).length},
  save(w){this._cache=w;Storage.set(KEYS.WORDS,w)},
  upsert(en,cn,ph,ex,exEn,exCn){
    const ws=this.getAll();const old=ws[en];
    ws[en]={english:en,chinese:cn,phonetic:ph,explanation:ex,exampleEn:exEn||(old?old.exampleEn:'')||'',exampleCn:exCn||(old?old.exampleCn:'')||'',
      stats:old?old.stats:{reviewCount:0,correctCount:0,wrongCount:0,lastReviewTime:null,nextReviewTime:null,easeFactor:2.5,interval:0}};
    this.save(ws);
  },
  updateStats(en,correct){
    const ws=this.getAll();const w=ws[en];if(!w)return;
    const s=w.stats;s.reviewCount++;s.lastReviewTime=new Date().toISOString();
    if(correct){
      s.correctCount++;s.easeFactor=Math.min(3.0,s.easeFactor+0.1);
      if(s.interval===0)s.interval=1;else if(s.interval===1)s.interval=3;else s.interval=Math.round(s.interval*s.easeFactor);
      s.nextReviewTime=addDays(getToday(),s.interval);
    }else{
      s.wrongCount++;s.easeFactor=Math.max(1.3,s.easeFactor-0.3);s.interval=1;s.nextReviewTime=addDays(getToday(),1);
    }
    this.save(ws);
  },
  getSortedList(){return Object.values(this.getAll()).sort((a,b)=>a.english.localeCompare(b.english))},
  search(q){q=q.toLowerCase().trim();if(!q)return this.getSortedList();return this.getSortedList().filter(w=>w.english.toLowerCase().includes(q)||w.chinese.includes(q)||(w.phonetic||'').toLowerCase().includes(q))}
};

const PlanStore={
  get(){return Storage.get(KEYS.PLAN,null)},
  save(p){Storage.set(KEYS.PLAN,{cycleDays:p.cycleDays||1,englishToChineseCount:p.englishToChineseCount||10,chineseToEnglishCount:p.chineseToEnglishCount||10,fillBlankCount:p.fillBlankCount||0,lastGeneratedDate:p.lastGeneratedDate||null,updatedAt:Date.now()})},
  updateLastGenerated(d){const p=this.get();if(p){p.lastGeneratedDate=d;Storage.set(KEYS.PLAN,p)}}
};

const SessionStore={
  getAll(){return Storage.get(KEYS.SESSIONS,[])},
  save(s){Storage.set(KEYS.SESSIONS,s)},
  getByDate(d){return this.getAll().find(s=>s.date===d)||null},
  getToday(){return this.getByDate(getToday())},
  createOrUpdate(s){const all=this.getAll();const i=all.findIndex(x=>x.date===s.date);if(i>=0)all[i]=s;else all.push(s);this.save(all);return s},
  markMissed(d){const e=this.getByDate(d);if(e&&e.status!=='completed'){e.status='missed';this.createOrUpdate(e)}else if(!e){this.createOrUpdate({date:d,status:'missed',words:[],rounds:[],totalRounds:0,planSnapshot:PlanStore.get()})}}
};

const Reward={
  getCoins(){return Storage.get(KEYS.COINS,0)},
  addCoins(n){const c=this.getCoins()+n;Storage.set(KEYS.COINS,c);return c},
  getStreak(){return Storage.get(KEYS.STREAK,{count:0,lastDay:null})},
  bumpStreak(){
    const today=getToday();const s=this.getStreak();
    if(s.lastDay===today)return s;
    if(s.lastDay&&daysBetween(s.lastDay,today)===1)s.count++;else s.count=1;
    s.lastDay=today;Storage.set(KEYS.STREAK,s);return s;
  }
};

/* ==== SPACED REPETITION ==== */
const SpacedRepetition={
  selectWords(total){
    const ws=Object.values(WordStore.getAll());if(!ws.length)return[];
    const today=getToday();const tMs=new Date(today+'T00:00:00').getTime();
    const rcs=ws.map(w=>w.stats.reviewCount).filter(c=>c>0);
    const avg=rcs.length?rcs.reduce((a,b)=>a+b,0)/rcs.length:0;
    const scored=ws.map(w=>{
      const s=w.stats;let sc;
      const op=avg>0?Math.max(0,(s.reviewCount-avg)/avg)*40:0;
      const rt=s.lastReviewTime&&s.lastReviewTime.startsWith(today);
      const tp=rt?200:0;
      if(s.reviewCount===0)sc=-1000+Math.random()*100;
      else if(s.nextReviewTime&&new Date(s.nextReviewTime+'T00:00:00').getTime()<=tMs){
        const od=daysBetween(s.nextReviewTime,today);
        sc=-500+Math.max(0,100-od)+op+tp+Math.random()*30;
      }else{
        const acc=s.correctCount/Math.max(1,s.reviewCount);
        const du=s.nextReviewTime?daysBetween(today,s.nextReviewTime):0;
        sc=du*10+acc*50+op+tp+Math.random()*30;
      }
      return{word:w.english,score:sc};
    });
    scored.sort((a,b)=>a.score-b.score);
    return scored.slice(0,Math.min(total,scored.length)).map(s=>s.word);
  }
};

/* ==== SFX ==== */
const SFX={
  _ctx:null,
  _getCtx(){if(!this._ctx)this._ctx=new(window.AudioContext||window.webkitAudioContext)();return this._ctx},
  play(t){
    try{
      const c=this._getCtx();const o=c.createOscillator();const g=c.createGain();o.connect(g);g.connect(c.destination);
      if(t==='correct'){o.type='sine';o.frequency.setValueAtTime(523,c.currentTime);o.frequency.setValueAtTime(659,c.currentTime+0.08);o.frequency.setValueAtTime(784,c.currentTime+0.16);o.frequency.setValueAtTime(1047,c.currentTime+0.24);g.gain.setValueAtTime(0.18,c.currentTime);g.gain.exponentialRampToValueAtTime(0.01,c.currentTime+0.4);o.start(c.currentTime);o.stop(c.currentTime+0.4);}
      else if(t==='combo'){o.type='triangle';o.frequency.setValueAtTime(659,c.currentTime);o.frequency.setValueAtTime(880,c.currentTime+0.08);o.frequency.setValueAtTime(1175,c.currentTime+0.16);g.gain.setValueAtTime(0.2,c.currentTime);g.gain.exponentialRampToValueAtTime(0.01,c.currentTime+0.5);o.start(c.currentTime);o.stop(c.currentTime+0.5);}
      else if(t==='coin'){o.type='triangle';o.frequency.setValueAtTime(988,c.currentTime);o.frequency.setValueAtTime(1318,c.currentTime+0.06);g.gain.setValueAtTime(0.15,c.currentTime);g.gain.exponentialRampToValueAtTime(0.01,c.currentTime+0.2);o.start(c.currentTime);o.stop(c.currentTime+0.2);}
      else{o.type='square';o.frequency.setValueAtTime(220,c.currentTime);o.frequency.setValueAtTime(160,c.currentTime+0.12);g.gain.setValueAtTime(0.10,c.currentTime);g.gain.exponentialRampToValueAtTime(0.01,c.currentTime+0.28);o.start(c.currentTime);o.stop(c.currentTime+0.28);}
    }catch{}
  }
};

function emojiBurst(correct){
  const emojis=correct?['⭐','🌟','✨','💫','🎉','🪙']:['💪','📚','🌱'];
  const card=document.getElementById('test-card');if(!card)return;
  const r=card.getBoundingClientRect();const cx=r.left+r.width/2,cy=r.top+r.height/2;
  const n=correct?7:3;
  for(let i=0;i<n;i++){
    const el=document.createElement('div');el.className='answer-emoji-burst';el.textContent=emojis[i%emojis.length];
    const a=(Math.PI*2/n)*i+(Math.random()-.5)*.5;const d=70+Math.random()*55;
    el.style.left=cx+'px';el.style.top=cy+'px';
    el.style.setProperty('--dx',Math.cos(a)*d+'px');el.style.setProperty('--dy',Math.sin(a)*d+'px');
    el.style.setProperty('--rot',(Math.random()*60-30)+'deg');el.style.animationDelay=(i*.05)+'s';
    document.body.appendChild(el);setTimeout(()=>el.remove(),1100);
  }
}

/* ==== CSV IMPORT ==== */
function triggerImport(){document.getElementById('csv-file-input').click()}
function detectCSVFormat(rows){
  const hw=['英文','english','word','单词'];
  for(const r of rows){if(r.length<2)continue;const f=(r[0]||'').trim().toLowerCase();if(!f||hw.includes(f))continue;return r.length>=6?'v2':'v1'}
  return 'v1';
}
function parseCSVRow(r,fmt){
  if(fmt==='v2')return{chinese:(r[1]||'').trim(),phonetic:(r[2]||'').trim(),exampleEn:(r[3]||'').trim(),exampleCn:(r[4]||'').trim(),explanation:r.slice(5).join(',').trim()};
  return{chinese:(r[1]||'').trim(),phonetic:(r[2]||'').trim(),exampleEn:'',exampleCn:'',explanation:r.slice(3).join(',').trim()};
}
function handleCSVImport(file){
  Papa.parse(file,{header:false,skipEmptyLines:true,complete(res){
    let added=0,updated=0,skipped=0;const fmt=detectCSVFormat(res.data);
    for(const row of res.data){
      if(row.length<2){skipped++;continue}
      const en=(row[0]||'').trim();if(!en){skipped++;continue}
      if(['英文','english','word','单词'].includes(en.toLowerCase()))continue;
      const f=parseCSVRow(row,fmt);const isNew=!WordStore.get(en);
      WordStore.upsert(en,f.chinese,f.phonetic,f.explanation,f.exampleEn,f.exampleCn);
      if(isNew)added++;else updated++;
    }
    showToast(`导入完成：新增 ${added}，更新 ${updated}`,'success');renderVocab();
  },error(){showToast('CSV 解析失败','error')}});
}
document.getElementById('csv-file-input').addEventListener('change',function(){if(this.files.length){handleCSVImport(this.files[0]);this.value=''}});

  const c=vocabColor(w.english);

    </div>

  </div>`;

function vocabLoadMore(){
  const items=document.getElementById('vocab-items');const ld=document.getElementById('vocab-loader');
  if(!items||vocabRendered>=vocabAll.length){if(ld)ld.classList.add('hidden');return}
  const batch=vocabAll.slice(vocabRendered,vocabRendered+VOCAB_PAGE_SIZE);
  items.insertAdjacentHTML('beforeend',batch.map(renderVocabItemHtml).join(''));
  vocabRendered+=batch.length;
  if(vocabRendered>=vocabAll.length&&ld)ld.classList.add('hidden');
}
function setupVocabScroll(){
  if(vocabObserver)vocabObserver.disconnect();
  const ld=document.getElementById('vocab-loader');if(!ld)return;
  vocabObserver=new IntersectionObserver(e=>{if(e[0].isIntersecting)vocabLoadMore()},{rootMargin:'200px'});
  vocabObserver.observe(ld);
}

    c.innerHTML=head+`<div class="learn-container"><div class="info-box"><div class="ic">🏆</div><p class="big" style="color:var(--good-deep)">今天已经完成啦！</p><p>背了 ${today.words.length} 个，用了 ${today.totalRounds} 轮</p><button class="btn btn-primary mt-16" onclick="restartLearning()">再来一组挑战</button><div style="height:10px"></div><button class="btn btn-secondary" onclick="navigate('home')">返回首页</button></div></div>`;return;
  }
  if(!learnState||learnState.date!==getToday())initLearnSession(plan);
  if(!learnState){c.innerHTML=head+`<div class="learn-container"><div class="info-box"><div class="ic">🌟</div><p class="big">暂时没有要练的单词</p><p>所有单词都还没到复习时间，明天见～</p><button class="btn btn-secondary mt-16" onclick="navigate('home')">返回首页</button></div></div>`;return;}
  c.innerHTML=head+`<div class="learn-container" id="learn-content"></div><div class="learn-bottom-nav" id="learn-bottom-nav" style="display:none"></div>`;
  renderLearnPhase();
}

function initLearnSession(plan){
  const en2cnN=plan.englishToChineseCount;const cn2enN=plan.chineseToEnglishCount;const fbN=plan.fillBlankCount||0;
  const total=en2cnN+cn2enN+fbN;
  const sel=SpacedRepetition.selectWords(total);
  if(!sel.length){learnState=null;return}
  const all=WordStore.getAll();
  let offset=0;
  const en2cnW=sel.slice(offset,offset+Math.min(en2cnN,sel.length));offset+=en2cnW.length;
  const remaining=sel.slice(offset);
  const cn2enW=remaining.slice(0,Math.min(cn2enN,remaining.length));offset+=cn2enW.length;
  const remaining2=sel.slice(offset);
  const wEx=remaining2.filter(e=>{const w=all[e];return w&&getWordExample(w)});
  const fbW=wEx.slice(0,Math.min(fbN,wEx.length));
  const aw=[...new Set([...en2cnW,...cn2enW,...fbW])];
  learnState={date:getToday(),phase:'preview',allWords:aw,en2cnWords:en2cnW,cn2enWords:cn2enW,fillBlankWords:fbW,previewIndex:0,questions:[],questionIndex:0,results:[],roundNumber:1,rounds:[],showFeedback:false};
  comboCount=0;
  const s=SessionStore.getToday();
  if(!s||s.status!=='in_progress'){
    SessionStore.createOrUpdate({date:getToday(),status:'in_progress',words:aw,rounds:[],totalRounds:0,planSnapshot:{...plan}});
  }
  PlanStore.updateLastGenerated(getToday());
}

function renderLearnPhase(){
  if(!learnState)return;
  const el=document.getElementById('learn-content');if(!el)return;
  const nav=document.getElementById('learn-bottom-nav');if(nav&&learnState.phase!=='preview'&&learnState.phase!=='review'&&learnState.phase!=='complete')nav.style.display='none';
  ({preview:renderPreview,confirm:renderConfirm,test:renderTest,review:renderReview,complete:renderComplete}[learnState.phase])(el);
}

function renderPreview(el){
  const ws=learnState.allWords;const idx=learnState.previewIndex;const w=WordStore.get(ws[idx]);if(!w)return;
  const pct=((idx+1)/ws.length*100).toFixed(0);
  const explHtml=w.explanation?marked.parse(w.explanation):'';
  const round=learnState.roundNumber>1?`<span class="round-pill">第 ${learnState.roundNumber} 轮 · 错题</span>`:'';
  let exHtml='';
  if(w.exampleEn)exHtml=`<div style="margin-top:12px;padding:10px 14px;background:var(--paper-warm);border:2px solid var(--line);border-radius:12px;font-size:14px;line-height:1.6;text-align:left"><div style="color:var(--ink)">📖 ${escapeHtml(w.exampleEn)}</div>${w.exampleCn?`<div style="color:var(--ink-soft);margin-top:4px">${escapeHtml(w.exampleCn)}</div>`:''}</div>`;
  el.innerHTML=`
    <div class="learn-top">
      ${mascotSvg().replace('mascot-svg','mascot-svg mini-mascot').replace('viewBox="0 0 200 200"','viewBox="0 0 200 200" style="width:54px;height:54px"')}
      <div class="pgwrap">
        <div class="learn-progress-bar"><div class="fill" style="width:${pct}%"></div></div>
        <div class="learn-progress-text" style="margin-bottom:0">预习 ${idx+1} / ${ws.length} ${round}</div>
      </div>
    </div>
    <div class="preview-card">
      <div class="word-en">${escapeHtml(w.english)}</div>
      <div class="word-phonetic">${escapeHtml(w.phonetic||'')}</div>
      <button class="btn-speak" onclick="speak('${escapeHtml(w.english).replace(/'/g,"\\'")}')">🔊 听一听</button>
      <div class="word-cn">${escapeHtml(w.chinese)}</div>
      ${exHtml}
      ${explHtml?`<div class="word-explanation">${explHtml}</div>`:''}
    </div>`;
  const nav=document.getElementById('learn-bottom-nav');
  if(nav){nav.style.display='';nav.innerHTML=`
    <button class="btn btn-secondary" onclick="previewPrev()" ${idx<=0?'disabled':''} style="flex:1">← 上一个</button>
    <button class="btn btn-primary" onclick="previewNext()" style="flex:1.2">${idx>=ws.length-1?'去测试 ✓':'下一个 →'}</button>`;}
  speak(w.english);
}
function previewPrev(){if(!learnState||learnState.previewIndex<=0)return;learnState.previewIndex--;renderLearnPhase()}
function previewNext(){if(!learnState)return;if(learnState.previewIndex>=learnState.allWords.length-1){learnState.phase='confirm';renderLearnPhase()}else{learnState.previewIndex++;renderLearnPhase()}}

function renderConfirm(el){
  const r=learnState.roundNumber>1?`<span class="round-pill">第 ${learnState.roundNumber} 轮</span>`:'';
  const fb=learnState.fillBlankWords.length>0?`<br>📝 例句填空 <strong>${learnState.fillBlankWords.length}</strong> 题`:'';
  el.innerHTML=`
    <div style="text-align:center;margin:14px 0 4px">${mascotSvg().replace('viewBox="0 0 200 200"','viewBox="0 0 200 200" style="width:120px;height:120px"')}</div>
    <div class="learn-phase-title">准备好了吗？${r}</div>
    <div class="learn-phase-desc">
      你刚刚预习了 <strong>${learnState.allWords.length}</strong> 个单词<br>
      📘 看英文选中文 <strong>${learnState.en2cnWords.length}</strong> 题<br>
      ✏️ 看中文写英文 <strong>${learnState.cn2enWords.length}</strong> 题${fb}
    </div>
    <div class="text-center"><button class="btn btn-primary btn-large" onclick="startTest()">开始测试！🚀</button></div>
  `;
}

function startTest(){
  if(!learnState)return;
  const qs=[];const all=WordStore.getAll();const list=Object.values(all);
  for(const e of shuffle(learnState.en2cnWords)){
    const w=all[e];if(!w)continue;
    const dis=shuffle(list.filter(x=>x.english!==e)).slice(0,2).map(x=>x.chinese);
    while(dis.length<2)dis.push('???');
    qs.push({type:'en2cn',word:e,prompt:w.english,answer:w.chinese,options:shuffle([w.chinese,...dis]),phonetic:w.phonetic||''});
  }
  for(const e of shuffle(learnState.cn2enWords)){const w=all[e];if(!w)continue;qs.push({type:'cn2en',word:e,prompt:w.chinese,answer:w.english})}
  for(const e of shuffle(learnState.fillBlankWords)){
    const w=all[e];if(!w)continue;const ex=getWordExample(w);if(!ex)continue;
    const re=new RegExp(e.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'i');if(!re.test(ex.en))continue;
    qs.push({type:'fillBlank',word:e,prompt:ex.en.replace(re,'______'),answer:w.english,sentenceCn:ex.cn,fullSentence:ex.en});
  }
  learnState.questions=qs;learnState.questionIndex=0;learnState.results=[];learnState.showFeedback=false;learnState.phase='test';
  comboCount=0;renderLearnPhase();
}

function renderTest(el){
  const q=learnState.questions[learnState.questionIndex];if(!q)return;
  const total=learnState.questions.length;const cur=learnState.questionIndex+1;const pct=(cur/total*100).toFixed(0);
  let qHtml='';
  const flash=learnState.showFeedback?(learnState.lastCorrect?'correct-flash':'wrong-flash'):'';
  if(q.type==='en2cn'){
    const opts=q.options.map((opt,i)=>{
      let cls='option-btn';
      if(learnState.showFeedback){
        cls+=' disabled';
        if(opt===q.answer)cls+=' show-correct';
        if(learnState.selectedOption===i&&opt!==q.answer)cls+=' selected-wrong';
        if(learnState.selectedOption===i&&opt===q.answer)cls='option-btn disabled selected-correct';
      }
      const letter=String.fromCharCode(65+i);
      return `<button class="${cls}" onclick="selectOption(${i})"><span class="opt-letter">${letter}</span>${escapeHtml(opt)}</button>`;
    }).join('');
    qHtml=`
      <div class="text-center" style="margin-bottom:14px"><span class="test-type-badge en2cn">📘 看英文选中文</span></div>

        <div class="test-prompt-sub">${escapeHtml(q.phonetic)}</div>
        <button class="btn-speak" onclick="speak('${escapeHtml(q.prompt).replace(/'/g,"\\'")}')">🔊</button>
      </div>
      <div class="test-options">${opts}</div>`;
  }else if(q.type==='cn2en'){
    let inCls='test-input';let val=learnState.typedAnswer||'';let fb='';
    if(learnState.showFeedback){
      inCls+=learnState.lastCorrect?' correct':' wrong';
      if(learnState.lastCorrect&&learnState.fuzzyMatch)fb=`<div class="test-feedback correct">回答正确 ✓ <span style="opacity:.75;font-size:.9em">（注意拼写：<strong>${escapeHtml(q.answer)}</strong>）</span></div>`;
      else if(learnState.lastCorrect)fb=`<div class="test-feedback correct">太棒了！回答正确 ✓</div>`;
      else fb=`<div class="test-feedback wrong">正确答案：<strong>${escapeHtml(q.answer)}</strong></div>`;
    }
    qHtml=`
      <div class="text-center" style="margin-bottom:14px"><span class="test-type-badge cn2en">✏️ 看中文写英文</span></div>
      <div class="test-question-card ${flash}" id="test-card">
        <div class="test-prompt">${escapeHtml(q.prompt)}</div>
      </div>
      <div class="test-input-group">
        <input class="${inCls}" type="text" id="answer-input" placeholder="输入英文..." value="${escapeHtml(val)}" onkeydown="if(event.key==='Enter')submitTyping()" ${learnState.showFeedback?'disabled':''} autocomplete="off" autocapitalize="off">
        ${!learnState.showFeedback?`<button class="btn btn-primary" onclick="submitTyping()">提交</button>`:''}
      </div>${fb}`;
  }else if(q.type==='fillBlank'){
    let inCls='test-input';let val=learnState.typedAnswer||'';let fb='';
    if(learnState.showFeedback){
      inCls+=learnState.lastCorrect?' correct':' wrong';
      if(learnState.lastCorrect&&learnState.fuzzyMatch)fb=`<div class="test-feedback correct">回答正确 ✓ <span style="opacity:.75;font-size:.9em">（拼写：<strong>${escapeHtml(q.answer)}</strong>）</span></div>`;
      else if(learnState.lastCorrect)fb=`<div class="test-feedback correct">太棒了！回答正确 ✓</div>`;
      else fb=`<div class="test-feedback wrong">正确答案：<strong>${escapeHtml(q.answer)}</strong></div>`;
      fb+=`<div class="test-feedback-sentence">📖 ${escapeHtml(q.fullSentence)}</div>`;
      if(q.sentenceCn)fb+=`<div class="test-feedback-sentence" style="color:var(--ink-soft);font-size:14px;margin-top:4px">🈶 ${escapeHtml(q.sentenceCn)}</div>`;
    }
    qHtml=`
      <div class="text-center" style="margin-bottom:14px"><span class="test-type-badge fillblank">📝 例句填空</span></div>
      <div class="test-question-card ${flash}" id="test-card">
        <div class="test-prompt" style="font-size:20px;line-height:1.5">${escapeHtml(q.prompt)}</div>
        <button class="btn-speak" onclick="speakCurrentSentence()" style="margin-top:10px">🔊 听句子</button>
        ${q.sentenceCn?`<div class="test-prompt-sub" style="margin-top:8px;font-size:14px;color:var(--ink-soft)">${escapeHtml(q.sentenceCn)}</div>`:''}
      </div>
      <div class="test-input-group">
        <input class="${inCls}" type="text" id="answer-input" placeholder="填上单词..." value="${escapeHtml(val)}" onkeydown="if(event.key==='Enter')submitTyping()" ${learnState.showFeedback?'disabled':''} autocomplete="off" autocapitalize="off">
        ${!learnState.showFeedback?`<button class="btn btn-primary" onclick="submitTyping()">提交</button>`:''}
      </div>${fb}`;
  }
  const nextBtn=learnState.showFeedback?`<div class="test-next-btn"><button class="btn btn-primary btn-block btn-large" onclick="nextQuestion()">${learnState.questionIndex>=learnState.questions.length-1?'看结果 →':'下一题 →'}</button></div>`:'';
  el.innerHTML=`
    <div class="learn-top">

      <div class="pgwrap">
        <div class="learn-progress-bar"><div class="fill" style="width:${pct}%"></div></div>
        <div class="learn-progress-text" style="margin-bottom:0">第 ${cur} / ${total} 题 · 连击 🔥${comboCount}</div>
      </div>
    </div>
    ${qHtml}${nextBtn}`;
  if(q.type==='en2cn'&&!learnState.showFeedback)speak(q.prompt);
  if((q.type==='cn2en'||q.type==='fillBlank')&&!learnState.showFeedback){setTimeout(()=>{const i=document.getElementById('answer-input');if(i)i.focus()},80)}

function showCombo(n){
  let txt='';
  if(n===3)txt='连击 ×3 🔥';
  else if(n===5)txt='超棒！×5 ⚡';
  else if(n===7)txt='太厉害啦 ×7 ✨';
  else if(n>=10)txt='神级 ×'+n+' 👑';
  if(!txt)return;
  const el=document.createElement('div');el.className='combo-banner';el.textContent=txt;
  document.body.appendChild(el);requestAnimationFrame(()=>el.classList.add('show'));
  SFX.play('combo');
  setTimeout(()=>el.remove(),1200);
}

function selectOption(i){
  if(!learnState||learnState.showFeedback)return;
  const q=learnState.questions[learnState.questionIndex];
  const sel=q.options[i];const correct=sel===q.answer;
  learnState.showFeedback=true;learnState.selectedOption=i;learnState.lastCorrect=correct;
  learnState.results.push({word:q.word,type:q.type,correct,userAnswer:sel});
  if(correct){comboCount++;Reward.addCoins(1);if([3,5,7,10,15].includes(comboCount))showCombo(comboCount)}else{comboCount=0}
  answerEffect(correct);renderLearnPhase();
}

function normalize(s){return s.toLowerCase().replace(/[^a-z0-9\s]/g,'').replace(/\s+/g,' ').trim()}

function submitTyping(){
  if(!learnState||learnState.showFeedback)return;
  const i=document.getElementById('answer-input');if(!i)return;
  const ua=i.value.trim();if(!ua){showToast('请输入答案','warning');return}
  const q=learnState.questions[learnState.questionIndex];
  const exact=ua.toLowerCase()===q.answer.toLowerCase();
  const fuzzy=!exact&&normalize(ua)===normalize(q.answer);
  const correct=exact||fuzzy;
  learnState.showFeedback=true;learnState.lastCorrect=correct;learnState.fuzzyMatch=fuzzy;learnState.typedAnswer=ua;
  learnState.results.push({word:q.word,type:q.type,correct,userAnswer:ua});
  if(correct){comboCount++;Reward.addCoins(1);if([3,5,7,10,15].includes(comboCount))showCombo(comboCount)}else{comboCount=0}
  answerEffect(correct);renderLearnPhase();
}

function nextQuestion(){
  if(!learnState)return;
  learnState.showFeedback=false;learnState.selectedOption=null;learnState.lastCorrect=null;learnState.fuzzyMatch=false;learnState.typedAnswer='';
  learnState.questionIndex++;
  if(learnState.questionIndex>=learnState.questions.length)finishRound();else renderLearnPhase();
}

function finishRound(){
  const r=learnState.results;const cc=r.filter(x=>x.correct).length;const wc=r.filter(x=>!x.correct).length;
  learnState.rounds.push({roundNumber:learnState.roundNumber,results:[...r],correctCount:cc,wrongCount:wc});
  for(const x of r)WordStore.updateStats(x.word,x.correct);
  const wrongResults=r.filter(x=>!x.correct);
  const wrong=[...new Set(wrongResults.map(x=>x.word))];
  learnState.wrongQuestions=wrongResults.map(wr=>learnState.questions.find(q=>q.word===wr.word&&q.type===wr.type)).filter(Boolean);
  if(wrong.length>0){learnState.phase='review';learnState.wrongWords=wrong}
  else{learnState.phase=wc===0&&learnState.roundNumber===1?'complete':'review';learnState.wrongWords=[]}
  renderLearnPhase();
}

function renderReview(el){
  const last=learnState.rounds[learnState.rounds.length-1];const has=learnState.wrongWords&&learnState.wrongWords.length>0;
  let wl='';
  if(has){
    const wr=last.results.filter(x=>!x.correct);
    wl=`<div class="wrong-list"><h3>📌 需要再练练的</h3>${wr.map(r=>{const w=WordStore.get(r.word);return`<div class="wrong-item"><div><div class="wrong-item-word">${escapeHtml(r.word)} — ${escapeHtml(w?w.chinese:'')}</div><div class="wrong-item-answer">你的答案：${escapeHtml(r.userAnswer)}</div></div></div>`}).join('')}</div>`;
  }
  el.innerHTML=`
    <div style="text-align:center">${mascotSvg(has?'sad':'happy').replace('viewBox="0 0 200 200"','viewBox="0 0 200 200" style="width:120px;height:120px"')}</div>
    <div class="learn-phase-title">第 ${learnState.roundNumber} 轮结束</div>
    <div class="review-stats">
      <div class="review-stat correct"><div class="num">${last.correctCount}</div><div class="label">正确</div></div>
      <div class="review-stat wrong"><div class="num">${last.wrongCount}</div><div class="label">错误</div></div>
    </div>
    ${wl}`;
  const nav=document.getElementById('learn-bottom-nav');
  if(nav){nav.style.display='';nav.innerHTML=has?`<button class="btn btn-primary btn-large" onclick="startErrorCorrection()" style="flex:1">再练一遍错题 💪</button>`:`<button class="btn btn-success btn-large" onclick="completeLearning()" style="flex:1">全部搞定！🏆</button>`;}
  if(!has)setTimeout(()=>fireConfetti(),250);
}

function startErrorCorrection(){
  if(!learnState)return;
  learnState.roundNumber++;
  const qs=shuffle([...(learnState.wrongQuestions||[])]);
  learnState.questions=qs;learnState.questionIndex=0;learnState.results=[];learnState.showFeedback=false;learnState.phase='test';
  comboCount=0;renderLearnPhase();
}

function renderComplete(el){
  const earnedCoins=learnState.rounds.reduce((s,r)=>s+r.correctCount,0)+10;
  Reward.addCoins(10);
  Reward.bumpStreak();
  el.innerHTML=`
    <div style="text-align:center;margin-top:8px">${mascotSvg('happy').replace('viewBox="0 0 200 200"','viewBox="0 0 200 200" style="width:140px;height:140px"')}</div>
    <div class="celebrate-stars">⭐🌟⭐</div>
    <div class="learn-phase-title">太棒了，全部完成！</div>
    <div class="learn-phase-desc">
      共学了 <strong>${[...new Set(learnState.rounds[0].results.map(r=>r.word))].length}</strong> 个单词<br>
      用了 <strong>${learnState.roundNumber}</strong> 轮 · 获得 🪙 +${earnedCoins}
    </div>
    `;
  const nav=document.getElementById('learn-bottom-nav');
  if(nav){nav.style.display='';nav.innerHTML=`<button class="btn btn-secondary" onclick="completeLearning()" style="flex:1">回首页休息</button><button class="btn btn-primary btn-large" onclick="completeLearningAndRestart()" style="flex:1.2">再来一组 →</button>`;}
  fireConfetti();
}

function completeLearning(){saveLearningSession();learnState=null;navigate('home')}
function completeLearningAndRestart(){saveLearningSession();restartLearning()}
function restartLearning(){
  const p=PlanStore.get();if(!p){navigate('home');return}
  learnState=null;initLearnSession(p);
  if(!learnState){showToast('没有更多要学的单词了','info');navigate('home');return}
  renderLearn();
}
function saveLearningSession(){
  if(!learnState)return;
  const s=SessionStore.getToday()||{};s.date=getToday();s.status='completed';
  const prev=s.words||[];const cur=learnState.rounds.length?[...new Set(learnState.rounds[0].results.map(r=>r.word))]:learnState.allWords;
  s.words=[...new Set([...prev,...cur])];
  s.rounds=[...(s.rounds||[]),...learnState.rounds];
  s.totalRounds=(s.totalRounds||0)+learnState.roundNumber;
  s.planSnapshot=PlanStore.get();
  SessionStore.createOrUpdate(s);
}
function exitLearn(){
  if(learnState&&learnState.phase!=='complete'){if(confirm('退出学习？当前进度不会保存哦'))learnState=null;else return;}
  navigate('home');
}
function fireConfetti(){
  if(typeof confetti!=='function')return;
  const colors=['#FF6B6B','#FFB546','#4ECDC4','#A78BFA','#FFD93D','#FF8FA8'];
  confetti({particleCount:90,spread:75,origin:{y:0.65},colors});
  setTimeout(()=>confetti({particleCount:55,spread:100,origin:{y:.55,x:.3},colors}),250);
  setTimeout(()=>confetti({particleCount:55,spread:100,origin:{y:.55,x:.7},colors}),420);
}

/* ==== HISTORY ==== */
const HISTORY_PAGE_SIZE=30;let historyAll=[],historyRendered=0,historyObserver=null;
function renderHistoryItemHtml(s){
  const lbl={completed:'已完成',in_progress:'进行中',missed:'已错过'}[s.status]||s.status;
  let detail='';
  if(s.status==='completed'&&s.rounds&&s.rounds.length){
    const tc=s.rounds.reduce((x,r)=>x+r.correctCount,0);const tw=s.rounds.reduce((x,r)=>x+r.wrongCount,0);
    detail=`<div>单词数：${(s.words||[]).length} 个</div><div>轮次：${s.totalRounds||s.rounds.length} 轮</div><div>✓ ${tc} 次 · ✗ ${tw} 次</div>${s.rounds.map(r=>`<div style="margin-top:4px;padding-left:8px;border-left:3px solid var(--p2)">第 ${r.roundNumber} 轮：✓ ${r.correctCount} / ✗ ${r.wrongCount}</div>`).join('')}`;
  }else if(s.status==='missed')detail='<div>这天没有完成学习</div>';
  else if(s.status==='in_progress')detail='<div>学习还没结束</div>';
  return `<div class="history-item" onclick="this.classList.toggle('expanded')">
    <div class="history-item-header"><span class="history-date">${formatDate(s.date)}</span><span class="history-badge ${s.status}">${lbl}</span></div>
    <div class="history-detail">${detail}</div></div>`;
}
function historyLoadMore(){
  const items=document.getElementById('history-items');const ld=document.getElementById('history-loader');
  if(!items||historyRendered>=historyAll.length){if(ld)ld.classList.add('hidden');return}
  const b=historyAll.slice(historyRendered,historyRendered+HISTORY_PAGE_SIZE);
  items.insertAdjacentHTML('beforeend',b.map(renderHistoryItemHtml).join(''));
  historyRendered+=b.length;
  if(historyRendered>=historyAll.length&&ld)ld.classList.add('hidden');
}
function setupHistoryScroll(){
  if(historyObserver)historyObserver.disconnect();
  const ld=document.getElementById('history-loader');if(!ld)return;
  historyObserver=new IntersectionObserver(e=>{if(e[0].isIntersecting)historyLoadMore()},{rootMargin:'200px'});
  historyObserver.observe(ld);
}
function renderHistory(){
  historyAll=SessionStore.getAll().slice().reverse();historyRendered=0;
  let content;
  if(!historyAll.length)content=`<div class="empty-box"><div class="ic">📅</div><p>还没有学习记录<br>开始你的第一次学习吧</p></div>`;
  else content=`<div id="history-items"></div><div id="history-loader" class="scroll-loader">加载更多...</div>`;
  document.getElementById('page-history').innerHTML=`
    <div class="app-bar"><button class="icon-btn" onclick="navigate('home')">←</button><h1>学习记录</h1><div class="icon-btn invisible"></div></div>
    <div class="history-list" style="padding-top:8px">${content}</div>`;
  if(historyAll.length){historyLoadMore();setupHistoryScroll()}
}

/* ==== MISSED SESSIONS ==== */
function checkAndMarkMissedSessions(){
  const p=PlanStore.get();if(!p||!p.lastGeneratedDate)return;
  const today=getToday();const lg=p.lastGeneratedDate;if(lg===today)return;
  const diff=daysBetween(lg,today);
  for(let i=0;i<diff;i++){
    const d=addDays(lg,i);if(d===today)break;
    const s=SessionStore.getByDate(d);
    if(s&&s.status==='in_progress')SessionStore.markMissed(d);
    else if(!s&&i%p.cycleDays===0&&i>0)SessionStore.markMissed(d);
  }
}

/* ==== BACKUP ==== */
async function exportBackup(){
  try{
    const data=await Storage.exportAll();const json=JSON.stringify(data,null,2);
    const blob=new Blob([json],{type:'application/json'});const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);a.download=`douDou-backup-${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(a.href);
    Storage.set(KEYS.LAST_BACKUP,new Date().toISOString());
    showToast('备份已下载 ✓','success');
    if(getRoute().page==='home')renderHome();
  }catch(e){showToast('导出失败：'+e.message,'error')}
}
function importBackup(file){
  const r=new FileReader();r.onload=async e=>{
    try{
      const d=JSON.parse(e.target.result);const valid=Object.values(KEYS);const found=Object.keys(d).filter(k=>valid.includes(k));
      if(!found.length){showToast('无效的备份文件','error');return}
      await Storage.importAll(d);WordStore._cache=null;
      showToast(`恢复成功（${found.length} 项）`,'success');onRoute();
    }catch{showToast('导入失败：文件格式错误','error')}
  };r.readAsText(file);
}
document.getElementById('backup-file-input').addEventListener('change',function(){if(this.files.length){importBackup(this.files[0]);this.value=''}});

/* ==== INIT ==== */
function autoImportFromUrl(){
  const params=new URLSearchParams(window.location.search);const file=params.get('import');if(!file)return;
  if(params.get('clear')==='1'){WordStore.save({});SessionStore.save([]);Storage.remove(KEYS.CURRENT)}
  fetch(file).then(r=>r.text()).then(csv=>{
    Papa.parse(csv,{header:false,skipEmptyLines:true,complete(res){
      let added=0,updated=0;const fmt=detectCSVFormat(res.data);
      for(const row of res.data){
        if(row.length<2)continue;const en=(row[0]||'').trim();
        if(!en||['英文','english'].includes(en.toLowerCase()))continue;
        const f=parseCSVRow(row,fmt);const isNew=!WordStore.get(en);
        WordStore.upsert(en,f.chinese,f.phonetic,f.explanation,f.exampleEn,f.exampleCn);
        if(isNew)added++;else updated++;
      }
      showToast(`自动导入：新增 ${added}，更新 ${updated}`,'success');
      window.history.replaceState({},'',window.location.pathname+window.location.hash);
      onRoute();
    }});
  }).catch(()=>showToast('自动导入失败','error'));
}
async function init(){
  await Storage.init();
  checkAndMarkMissedSessions();
  window.addEventListener('hashchange',onRoute);
  autoImportFromUrl();
  onRoute();
}
document.addEventListener('DOMContentLoaded',init);
</script>
